version: "3.8"

services:
  fastapi:
    build: ./fastapi
    container_name: fastapi
    environment:
      MYSQL_HOST: mysql
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      RABBITMQ_QUEUE: form_data
      MYSQL_USER: clado_user
      MYSQL_PASSWORD: Tqwe123!@#
      MYSQL_DATABASE: clado_db
      MYSQL_ROOT_PASSWORD: Tqwe123!@#
      API_HOST: 127.0.0.1
      API_PORT: 8000
      CORS_ORIGINS: http://localhost
    ports:
      - "8000:8000"
    depends_on:
      - mysql
      - rabbitmq
    networks:
      - mynetwork

  consumer:
    build: ./consumer
    container_name: consumer
    environment:
      MYSQL_HOST: mysql
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      RABBITMQ_QUEUE: form_data
      MYSQL_USER: clado_user
      MYSQL_PASSWORD: Tqwe123!@#
      MYSQL_DATABASE: clado_db
      MYSQL_ROOT_PASSWORD: Tqwe123!@#
    depends_on:
      - mysql
      - rabbitmq
    command: ["wait-for-it", "rabbitmq:5672", "--", "python", "/app/main.py"]
    networks:
      - mynetwork

  nginx:
    build: ./webapp
    container_name: webapp
    ports:
      - "80:80"
    depends_on:
      - fastapi
      - consumer
      - mysql
      - rabbitmq
    networks:
      - mynetwork

  mysql:
    image: mysql:8
    container_name: mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_USER: clado_user
      MYSQL_PASSWORD: Tqwe123!@#
      MYSQL_DATABASE: clado_db
      MYSQL_ROOT_PASSWORD: Tqwe123!@#
    ports:
      - "3307:3306"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - mynetwork
    command: --pid-file=/tmp/mysql.pid

  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_QUEUE: form_data

    ports:
      - "5672:5672"
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    depends_on:
      - mysql
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: bridge

volumes:
  rabbitmq_data:
